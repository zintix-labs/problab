version: "2"

issues:
  # Show every finding instead of hiding repeated errors during upgrades.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  settings:
    staticcheck:
      # Preserve the standard exclusions; defer optional expression/loop
      # rewrites so a toolchain upgrade does not change RNG-sensitive code.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1002
        - -QF1006
        - -QF1008
